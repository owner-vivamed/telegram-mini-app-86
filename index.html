<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Premium Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --accent-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at top left, #2d3436, #000000);
        }

        /* Ambient Background Blotches */
        .ambient-light {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            top: -50px;
            left: -50px;
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }

        .ambient-light-2 {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 206, 201, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -50px;
            right: -50px;
            z-index: 0;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, 20px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 1;
            animation: popup 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: #b2bec3;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .main-btn {
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            position: relative;
            overflow: hidden;
        }

        .main-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .main-btn:hover::before {
            left: 100%;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
        }

        .main-btn:active {
            transform: translateY(1px);
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>

    <div class="ambient-light"></div>
    <div class="ambient-light-2"></div>

    <div class="container">
        <div class="logo">🚀</div>
        <h1>Xush Kelibsiz!</h1>
        <p>Sizning yangi Premium darajadagi Telegram Mini App interfeysingiz tayyor.</p>
        <button class="main-btn" onclick="showPopup()">Boshlash</button>

        <footer>v1.0 • Antigravity tomonidan yaratildi</footer>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ilovani to'liq ekran qilish

        // Mavzuga moslashish (Theme Params)
        if (tg.themeParams.bg_color) {
            document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color);
            document.documentElement.style.setProperty('--card-bg', tg.themeParams.secondary_bg_color || 'rgba(255, 255, 255, 0.05)');
            document.documentElement.style.setProperty('--text-color', tg.themeParams.text_color);
        }

        function showPopup() {
            tg.showPopup({
                title: 'Zo\'r natija!',
                message: 'Ushbu tugma Telegram WebApp interfeysi orqali ishlamoqda.',
                buttons: [{ type: 'ok', text: 'Tushunarli' }]
            });
        }
    </script>
</body>

</html>
